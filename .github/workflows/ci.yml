name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Tests (includes the slow training-reproducibility smoke test)
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sentinel:ci .
      - name: Container starts and reports ready
        run: |
          docker run -d --name s -e API_KEYS=ci-key -p 8000:8000 sentinel:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/ready && break || sleep 2; done
          curl -fs -H "X-API-Key: ci-key" localhost:8000/model/info > /dev/null
